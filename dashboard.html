<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Support Results</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f3;
    --surface: #ffffff;
    --line: #e4e3df;
    --grid: #ecebe7;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #7a7974;
    --answered: #2a78d6;
    --handed: #eb6834;
    --good: #0f7b3e;
    --good-bg: #e6f4ea;
    --warn-bg: #fff4e5;
    --warn: #8a4b00;
    --track: #ecebe7;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --line: #2c2c2a; --grid: #262624;
      --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #96958c;
      --answered: #3987e5; --handed: #d95926;
      --good: #5cc884; --good-bg: #17301f; --warn-bg: #33240f; --warn: #f0b060; --track: #2c2c2a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --line: #2c2c2a; --grid: #262624;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #96958c;
    --answered: #3987e5; --handed: #d95926;
    --good: #5cc884; --good-bg: #17301f; --warn-bg: #33240f; --warn: #f0b060; --track: #2c2c2a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .eyebrow { font-size: 13px; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 6px; }
  h1 { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--ink-2); font-size: 14px; margin-top: 6px; }
  .range { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .range button { border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 7px; cursor: pointer; }
  .range button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 14px; }
  .tile .k { font-size: 13px; color: var(--ink-2); line-height: 1.3; min-height: 34px; }
  .tile .v { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tile .n { font-size: 12px; color: var(--ink-3); margin-top: 4px; line-height: 1.35; }
  .tile.hero { border-color: var(--answered); box-shadow: inset 0 0 0 1px var(--answered); }
  .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  .card .hint { font-size: 13px; color: var(--ink-2); margin: 0 0 14px; line-height: 1.45; }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; line-height: 1.45;
    padding: 8px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); opacity: 0; transition: opacity .1s; }
  .tip b { font-weight: 600; }
  .bars .row { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 10px; align-items: center; margin-bottom: 11px; }
  .bars .lbl { font-size: 13px; color: var(--ink); margin-bottom: 5px; }
  .bars .track { height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; }
  .bars .fill { height: 100%; background: var(--answered); border-radius: 5px; }
  .bars .num { font-size: 13px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; align-self: end; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 11px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.45; }
  .list li:first-child { border-top: 0; padding-top: 2px; }
  .meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--track); color: var(--ink-2); margin-right: 6px; vertical-align: 1px; }
  .ok { background: var(--good-bg); color: var(--good); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
  .note { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; line-height: 1.45; }
  .gauge { height: 14px; background: var(--track); border-radius: 7px; position: relative; overflow: visible; margin: 18px 0 8px; }
  .gauge .fill { height: 100%; background: var(--answered); border-radius: 7px; }
  .gauge .target { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); }
  .gauge-lbls { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); }
  details { margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  details table { border-collapse: collapse; margin-top: 8px; width: 100%; }
  details th, details td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  footer { font-size: 12px; color: var(--ink-3); margin-top: 22px; line-height: 1.5; }
  .center { text-align: center; padding: 80px 20px; color: var(--ink-2); }
  @media (max-width: 900px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tiles .tile.hero { grid-column: 1 / -1; }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">Loading your results...</div></div>

<script>
(function () {
  // ---- settings: the Supabase project and its public (anon / publishable) key ----
  var SUPABASE_URL = 'https://nncxvsnenymnhsjqnaco.supabase.co';
  var SUPABASE_PUBLIC_KEY = 'sb_publishable_WcLbEQ2e8quEd-_dLpWuCA_YKF1-7JD';

  // the store and its private dashboard key come from the link: dashboard.html?store=...&key=...
  var params = new URLSearchParams(location.search);
  var store = params.get('store') || '';
  var key = params.get('key') || '';
  var days = 7;

  var app = document.getElementById('app');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function fmt(n) { return Number(n || 0).toLocaleString('en-US'); }
  function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
  function shortDate(iso) {
    var d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function ago(iso) {
    var h = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 3600000));
    if (h < 1) return 'just now';
    if (h < 48) return h + ' hour' + (h === 1 ? '' : 's') + ' ago';
    return Math.round(h / 24) + ' days ago';
  }

  // new publishable keys go in the apikey header only; legacy anon keys also go in Authorization
  function authHeaders() {
    var h = { 'Content-Type': 'application/json', 'apikey': SUPABASE_PUBLIC_KEY };
    if (SUPABASE_PUBLIC_KEY.indexOf('sb_') !== 0) h['Authorization'] = 'Bearer ' + SUPABASE_PUBLIC_KEY;
    return h;
  }

  function load() {
    if (!store || !key) { showMessage('This link is missing its store details. Please use the link you were given.'); return; }
    fetch(SUPABASE_URL + '/rest/v1/rpc/dashboard_stats', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ p_client: store, p_key: key, p_days: days })
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(render).catch(function () {
      showMessage('We could not load your results. Check the link, or try again in a minute.');
    });
  }

  function showMessage(t) { app.textContent = ''; app.appendChild(el('div', 'center', t)); }

  function tile(k, v, n, hero) {
    var t = el('div', 'tile' + (hero ? ' hero' : ''));
    t.appendChild(el('div', 'k', k));
    t.appendChild(el('div', 'v', v));
    if (n) t.appendChild(el('div', 'n', n));
    return t;
  }

  function dailyChart(rows) {
    var wrap = el('div', 'chart');
    var W = 640, H = 230, L = 34, R = 8, T = 10, B = 28;
    var max = 1;
    rows.forEach(function (r) { max = Math.max(max, r.answered + r.handed); });
    var step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : max <= 50 ? 10 : Math.ceil(max / 5 / 10) * 10;
    var top = Math.ceil(max / step) * step;
    var y = function (v) { return T + (H - T - B) * (1 - v / top); };
    var band = (W - L - R) / rows.length;
    var bw = Math.min(36, band * 0.62);
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Questions per day, answered by the assistant and passed to your team');
    function node(tag, attrs, text) {
      var n = document.createElementNS(ns, tag);
      for (var a in attrs) n.setAttribute(a, attrs[a]);
      if (text != null) n.textContent = text;
      svg.appendChild(n);
      return n;
    }
    for (var v = 0; v <= top; v += step) {
      node('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: 'var(--grid)', 'stroke-width': 1 });
      node('text', { x: L - 8, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--ink-3)' }, v);
    }
    var tip = el('div', 'tip');
    rows.forEach(function (r, i) {
      var cx = L + band * i + band / 2;
      var x = cx - bw / 2;
      var ya = y(r.answered), yh = y(r.answered + r.handed);
      // answered sits on the baseline; handed stacks on top with a 2px gap
      if (r.answered > 0) {
        var h1 = y(0) - ya;
        node('path', { d: roundTop(x, ya, bw, h1, r.handed > 0 ? 0 : 4), fill: 'var(--answered)' });
      }
      if (r.handed > 0) {
        var h2 = ya - yh - (r.answered > 0 ? 2 : 0);
        if (h2 > 0) node('path', { d: roundTop(x, yh, bw, h2, 4), fill: 'var(--handed)' });
      }
      var lbl = shortDate(r.date).split(',')[0];
      node('text', { x: cx, y: H - 8, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--ink-3)' }, rows.length > 10 ? (i % 5 === 0 ? shortDate(r.date).replace(/^\w+, /, '') : '') : lbl);
      var hit = node('rect', { x: L + band * i, y: T, width: band, height: H - T - B, fill: 'transparent' });
      hit.style.cursor = 'default';
      hit.addEventListener('mouseenter', function () {
        tip.textContent = '';
        tip.appendChild(el('b', null, shortDate(r.date)));
        tip.appendChild(document.createElement('br'));
        tip.appendChild(document.createTextNode('Answered: ' + r.answered));
        tip.appendChild(document.createElement('br'));
        tip.appendChild(document.createTextNode('Passed to your team: ' + r.handed));
        var box = svg.getBoundingClientRect();
        tip.style.left = (cx / W * box.width) + 'px';
        tip.style.top = (yh / H * box.height - 8) + 'px';
        tip.style.opacity = 1;
      });
      hit.addEventListener('mouseleave', function () { tip.style.opacity = 0; });
    });
    node('line', { x1: L, x2: W - R, y1: y(0), y2: y(0), stroke: 'var(--ink-3)', 'stroke-width': 1 });
    wrap.appendChild(svg);
    wrap.appendChild(tip);
    return wrap;
  }
  function roundTop(x, y, w, h, r) {
    r = Math.min(r, h, w / 2);
    return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
      'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
  }

  function render(d) {
    var t = d.totals || {};
    var hours = Math.round((t.saved_minutes || 0) / 6) / 10;
    var answeredPct = t.questions ? Math.round(t.answered / t.questions * 100) : 0;
    app.textContent = '';

    // header
    var head = el('header');
    var left = el('div');
    left.appendChild(el('p', 'eyebrow', 'Support results'));
    left.appendChild(el('h1', null, d.store));
    left.appendChild(el('div', 'sub', 'Last ' + d.days + ' days. Updated ' + new Date(d.generated_at).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) + '.'));
    head.appendChild(left);
    var range = el('div', 'range');
    [7, 30].forEach(function (n) {
      var b = el('button', null, 'Last ' + n + ' days');
      b.setAttribute('aria-pressed', String(days === n));
      b.addEventListener('click', function () { if (days !== n) { days = n; load(); } });
      range.appendChild(b);
    });
    head.appendChild(range);
    app.appendChild(head);

    // results tiles
    var tiles = el('section', 'tiles');
    tiles.setAttribute('aria-label', 'Results');
    tiles.appendChild(tile('Questions answered for you', fmt(t.answered), answeredPct + '% of ' + fmt(t.questions) + ' customer questions', true));
    tiles.appendChild(tile('Team time saved', hours + ' h', 'At ' + d.minutes_per_question + ' minutes per question'));
    tiles.appendChild(tile('Answered outside business hours', fmt(t.after_hours), 'Evenings, nights and weekends'));
    tiles.appendChild(tile('Typical reply time', (t.median_reply_seconds != null ? t.median_reply_seconds : '-') + ' s', 'From question to answer'));
    tiles.appendChild(tile('Passed to your team', fmt(t.handed), 'Each with the full conversation'));
    app.appendChild(tiles);

    // chart + attention
    var g1 = el('section', 'grid2');
    var c1 = el('div', 'card');
    c1.appendChild(el('h2', null, 'Questions per day'));
    c1.appendChild(el('p', 'hint', 'Most questions are answered on the spot. The rest go to your team with the conversation attached.'));
    var lg = el('div', 'legend');
    var l1 = el('span'); var i1 = el('i'); i1.style.background = 'var(--answered)'; l1.appendChild(i1); l1.appendChild(document.createTextNode('Answered by the assistant'));
    var l2 = el('span'); var i2 = el('i'); i2.style.background = 'var(--handed)'; l2.appendChild(i2); l2.appendChild(document.createTextNode('Passed to your team'));
    lg.appendChild(l1); lg.appendChild(l2);
    c1.appendChild(lg);
    c1.appendChild(dailyChart(d.daily || []));
    var det = el('details');
    det.appendChild(el('summary', null, 'View as a table'));
    var tb = el('table');
    var hr = el('tr'); ['Day', 'Answered', 'Passed to team'].forEach(function (h) { hr.appendChild(el('th', null, h)); }); tb.appendChild(hr);
    (d.daily || []).forEach(function (r) {
      var tr = el('tr'); tr.appendChild(el('td', null, shortDate(r.date))); tr.appendChild(el('td', null, r.answered)); tr.appendChild(el('td', null, r.handed)); tb.appendChild(tr);
    });
    det.appendChild(tb);
    c1.appendChild(det);
    g1.appendChild(c1);

    var c2 = el('div', 'card');
    c2.appendChild(el('h2', null, 'Needs your attention'));
    var tk = d.tickets || {};
    var gaps = d.gaps || [];
    if (!tk.open && !gaps.length) {
      c2.appendChild(el('p', 'hint', 'Nothing is waiting for you.'));
      c2.appendChild(el('div', 'ok', 'Every ticket is closed and your policies covered every question this period.'));
    } else {
      if (tk.open) {
        c2.appendChild(el('p', 'hint', tk.open + ' open ticket' + (tk.open === 1 ? '' : 's') + ' waiting for a reply from your team.'));
        var ul = el('ul', 'list');
        (tk.open_list || []).forEach(function (x) {
          var li = el('li');
          var top = el('div'); top.appendChild(el('span', 'pill', cap(x.topic))); top.appendChild(document.createTextNode(x.summary || 'Customer question'));
          li.appendChild(top);
          li.appendChild(el('div', 'meta', '#' + x.id + ' · opened ' + ago(x.created_at) + (x.contact ? ' · ' + x.contact : ' · no email yet')));
          ul.appendChild(li);
        });
        c2.appendChild(ul);
      }
      if (gaps.length) {
        var gh = el('p', 'hint', 'Your policies don\'t answer these yet. Add a line for each and the assistant will answer them next time:');
        if (tk.open) gh.style.marginTop = '18px';
        c2.appendChild(gh);
        var ul2 = el('ul', 'list');
        gaps.forEach(function (q) { ul2.appendChild(el('li', null, cap(q))); });
        c2.appendChild(ul2);
      }
    }
    g1.appendChild(c2);
    app.appendChild(g1);

    // topics + go-live
    var g2 = el('section', 'grid2');
    var c3 = el('div', 'card');
    c3.appendChild(el('h2', null, 'What customers ask about'));
    c3.appendChild(el('p', 'hint', 'Every question this period, grouped by subject.'));
    var bars = el('div', 'bars');
    var topics = d.topics || [];
    var tmax = 1; topics.forEach(function (x) { tmax = Math.max(tmax, x.count); });
    topics.forEach(function (x) {
      var row = el('div', 'row');
      var lft = el('div');
      lft.appendChild(el('div', 'lbl', x.topic));
      var tr = el('div', 'track'); var f = el('div', 'fill'); f.style.width = Math.max(2, x.count / tmax * 100) + '%'; tr.appendChild(f); lft.appendChild(tr);
      row.appendChild(lft);
      row.appendChild(el('div', 'num', fmt(x.count)));
      bars.appendChild(row);
    });
    if (!topics.length) bars.appendChild(el('p', 'hint', 'No questions yet in this period.'));
    c3.appendChild(bars);
    g2.appendChild(c3);

    var c4 = el('div', 'card');
    var dr = d.drafts || {};
    var decided = (dr.approved || 0) + (dr.edited || 0) + (dr.handed || 0);
    if (d.mode === 'draft') {
      c4.appendChild(el('h2', null, 'Go-live progress'));
      c4.appendChild(el('p', 'hint', 'While you are in draft mode, your team checks every answer before customers see it. Go live once almost all are approved as written.'));
      var rate = decided ? Math.round(dr.approved / decided * 100) : 0;
      c4.appendChild(el('div', 'v', decided ? rate + '%' : 'No drafts yet')).style.cssText = 'font-size:30px;font-weight:700;letter-spacing:-.02em';
      c4.appendChild(el('div', 'meta', 'approved as written'));
      var gg = el('div', 'gauge'); var gf = el('div', 'fill'); gf.style.width = rate + '%'; gg.appendChild(gf);
      var tg = el('div', 'target'); tg.style.left = '95%'; tg.title = 'Go-live target: 95%'; gg.appendChild(tg);
      c4.appendChild(gg);
      var gl = el('div', 'gauge-lbls'); gl.appendChild(el('span', null, '0%')); gl.appendChild(el('span', null, 'Target 95%')); c4.appendChild(gl);
      c4.appendChild(el('p', 'hint', dr.approved + ' approved, ' + dr.edited + ' edited, ' + dr.handed + ' handled by your team' + (dr.waiting ? ', ' + dr.waiting + ' waiting now' : '') + '.')).style.marginTop = '14px';
    } else {
      c4.appendChild(el('h2', null, 'Tickets'));
      c4.appendChild(el('p', 'hint', 'Questions passed to your team, and how many are closed.'));
      var tg2 = el('div', 'tiles'); tg2.style.cssText = 'grid-template-columns:repeat(3,minmax(0,1fr));margin:0';
      tg2.appendChild(tile('Opened', fmt(tk.opened)));
      tg2.appendChild(tile('Closed', fmt(tk.resolved)));
      tg2.appendChild(tile('Still open', fmt(tk.open)));
      c4.appendChild(tg2);
      c4.appendChild(el('p', 'hint', 'Your assistant is live: answers go straight to customers, and anything it can\'t answer from your policies goes to your team.')).style.marginTop = '14px';
    }
    g2.appendChild(c4);
    app.appendChild(g2);

    var ft = el('footer', null, 'Time saved is an estimate: questions answered without your team, times ' + d.minutes_per_question +
      ' minutes each (minus review time for approved drafts). Business hours are 9am to 5pm, Monday to Friday, ' + d.timezone.replace('_', ' ') + ' time.');
    app.appendChild(ft);
  }

  load();
})();
</script>
</body>
</html>
